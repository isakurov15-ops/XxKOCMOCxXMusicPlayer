name: Build APK

on:
  push:
    branches: [main]
  paths:
      - '*.zip'
      - '**/*.zip'
      - '.github/workflows/android-build-from-zip.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          ZIP=$(find . -name '*.zip' | head -n 1)
          mkdir extracted
          unzip -q "$ZIP" -d extracted
          DIR=$(find extracted -name settings.gradle | head -n 1)
          echo "PROJECT_DIR=$(dirname "$DIR")" >> "$GITHUB_ENV"

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: MusicPlayer-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
